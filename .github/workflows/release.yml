name: release

on:
  push:
    tags: ["v*"]

# Lecture seule pour tout le workflow : les suites n'écrivent rien, quels que soient les droits par
# défaut du dépôt. Seul le job qui crée la release reçoit `contents: write`, et rien d'autre.
permissions:
  contents: read

jobs:
  # Un tag peut viser un commit que `tests.yml` n'a jamais vu : la publication attend ici les mêmes
  # suites. Les actions restent celles de `tests.yml`, au même commit complet : la construction
  # doit rester celle des pull requests, et les deux fichiers ne s'épinglent qu'ensemble. Un tag
  # (`@v4`) se déplace ; un commit de 40 caractères hexadécimaux, non.
  release:
    needs: [pytest, pytest-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Avant le checkout : le binaire embarque le mod, et son empreinte se compare au dépôt.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-build.txt
      - name: Build
        shell: bash
        run: python -m PyInstaller packaging/pz-duel.spec --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/build"
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py "$RUNNER_TEMP/dist/pz-duel.exe"
      # Depuis le dossier du binaire : le fichier nomme `pz-duel.exe`, sans chemin du runner.
      - name: Checksum
        shell: bash
        run: cd "$RUNNER_TEMP/dist" && sha256sum pz-duel.exe > pz-duel.exe.sha256
      # Aucun `if:` ici : la condition implicite `success()` lie la publication au test de fumée.
      # Sans release, elle la crée ; `--verify-tag` interdit de créer un tag sur la branche par
      # défaut. `--clobber` laisse une relance remplacer les pièces d'un envoi interrompu.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "Unsigned Windows build of PZ Duel. Check pz-duel.exe against pz-duel.exe.sha256." \
              "${prerelease[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist/pz-duel.exe" \
            "$RUNNER_TEMP/dist/pz-duel.exe.sha256" --clobber

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Historique complet : AC53 extrait 1d854d0 par `git archive`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      # Les tests du vrai jeu sont en skip hors d'une machine avec Project Zomboid.
      - run: python -m pytest -q

  pytest-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Avant le checkout : en CRLF, les fixtures et le mod fausseraient AC17 et AC30.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      # -rs imprime chaque raison de skip : AC54 se relit dans le journal du job.
      - run: python -m pytest -q -rs
