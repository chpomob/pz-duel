name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Historique complet : AC53 extrait 1d854d0 par `git archive`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      # Les tests du vrai jeu sont en skip hors d'une machine avec Project Zomboid.
      - run: python -m pytest -q

  pytest-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Avant le checkout : en CRLF, les fixtures et le mod fausseraient AC17 et AC30.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      # -rs imprime chaque raison de skip : AC54 se relit dans le journal du job.
      - run: python -m pytest -q -rs

  build-windows:
    runs-on: windows-latest
    steps:
      # Avant le checkout : le binaire embarque le mod, et son empreinte se compare au dépôt.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r packaging/requirements-build.txt
      # Sortie hors du dépôt : `.gitignore` ne change pas.
      - name: Build
        shell: bash
        run: python -m PyInstaller packaging/pz-duel.spec --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/build"
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py "$RUNNER_TEMP/dist/pz-duel.exe"
