name: tests

on:
  push:
    branches: [master]
  pull_request:

# P9F29 : la patience des tests d'attente (`tests/doubles/waiting.py`). Un runner partagé est
# trois à cinq fois plus lent qu'une machine de développement sur les opérations de processus.
env:
  PZDUEL_TEST_WAIT_S: "60"

# Lecture seule pour tout le workflow. Seul `test-build`, qui publie la release roulante, reçoit
# `contents: write` : les suites et la construction des pull requests n'écrivent rien.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Historique complet : AC53 extrait 1d854d0 par `git archive`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest pyyaml
      # Les tests du vrai jeu sont en skip hors d'une machine avec Project Zomboid.
      - run: python -m pytest -q

  pytest-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Avant le checkout : en CRLF, les fixtures et le mod fausseraient AC17 et AC30.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest pyyaml
      # -rs imprime chaque raison de skip : AC54 se relit dans le journal du job.
      - run: python -m pytest -q -rs

  build-windows:
    runs-on: windows-latest
    steps:
      # Avant le checkout : le binaire embarque le mod, et son empreinte se compare au dépôt.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-build.txt"
      # Sortie hors du dépôt : `.gitignore` ne change pas.
      - name: Build
        shell: bash
        run: python -m PyInstaller packaging/pz-duel.spec --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/build"
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py "$RUNNER_TEMP/dist/pz-duel.exe"

  # P9F31 : la release de test roulante. Après les deux suites, et seulement sur un push de
  # `master` (une pull request ne construit rien ici), la même construction que `release.yml`
  # publie au tag fixe `test` : `releases/download/test/pz-duel.exe` est toujours la dernière
  # version verte. Les releases `v*` restent des jalons publiés à la main.
  test-build:
    needs: [pytest, pytest-windows]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    # Une publication à la fois : deux pushes rapprochés ne s'écrivent pas l'un sur l'autre.
    concurrency:
      group: test-build
      cancel-in-progress: false
    steps:
      # Avant le checkout : le binaire embarque le mod, et son empreinte se compare au dépôt.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-build.txt"
      - name: Build
        shell: bash
        run: python -m PyInstaller packaging/pz-duel.spec --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/build"
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py "$RUNNER_TEMP/dist/pz-duel.exe"
      # Depuis le dossier du binaire : le fichier nomme `pz-duel.exe`, sans chemin du runner.
      - name: Checksum
        shell: bash
        run: cd "$RUNNER_TEMP/dist" && sha256sum pz-duel.exe > pz-duel.exe.sha256
      # Les notes reprennent ce que le binaire dit de lui-même (`--version`). Un passage plus lent
      # qu'un push plus récent ne recule pas `test` : il ne publie que si `test` est son ancêtre.
      # Le tag suit le commit publié, et la release est créée au premier passage, éditée ensuite.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$("$RUNNER_TEMP/dist/pz-duel.exe" --version)"
          built_at="${version##*built }"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          notes="$(printf 'Rolling unsigned test build of PZ Duel, from the latest green master.\n\n%s\n\n- commit: %s (%s)\n- subject: %s\n- built: %s\n\nCheck pz-duel.exe against pz-duel.exe.sha256.' \
            "$version" "${GITHUB_SHA:0:7}" "$GITHUB_SHA" "$subject" "${built_at%)}")"
          if git fetch --force origin refs/tags/test:refs/tags/test 2> /dev/null \
            && ! git merge-base --is-ancestor refs/tags/test "$GITHUB_SHA"; then
            echo "test already holds a newer commit than $GITHUB_SHA: nothing published"
          else
            git push --force origin "$GITHUB_SHA:refs/tags/test"
            if gh release view test > /dev/null 2>&1; then
              gh release edit test --title "test (${GITHUB_SHA:0:7})" --notes "$notes" --prerelease
            else
              gh release create test --verify-tag --title "test (${GITHUB_SHA:0:7})" \
                --notes "$notes" --prerelease
            fi
            gh release upload test "$RUNNER_TEMP/dist/pz-duel.exe" \
              "$RUNNER_TEMP/dist/pz-duel.exe.sha256" --clobber
          fi
